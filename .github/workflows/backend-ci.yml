name: Backend CI

on:
  push:
    branches: [ main, validation-and-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Concurrency, Security & API Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Automated Test Suite
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5050
          MONGO_URI: mongodb://127.0.0.1:27017/vanishlink_test
          JWT_SECRET: VanishLink2025SecureKey!@$%^&*()_.+
        run: npm test

